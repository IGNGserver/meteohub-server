services:
  postgres:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: meteohub
      POSTGRES_USER: meteohub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meteohub -d meteohub"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

  server:
    image: ghcr.io/${GHCR_OWNER:-igngserver}/meteohub-server:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      APP_VERSION: ${APP_VERSION:-1.0.0}
      HOST: 0.0.0.0
      PORT: 8080
      DATABASE_URL: postgres://meteohub:${POSTGRES_PASSWORD}@postgres:5432/meteohub
      DATABASE_SSL: "false"
      TOKEN_PEPPER: ${TOKEN_PEPPER:?set TOKEN_PEPPER in .env}
      RAW_RETENTION_DAYS: ${RAW_RETENTION_DAYS:-365}
      CALIBRATION_ENABLED: ${CALIBRATION_ENABLED:-true}
      INGESTION_ENABLED: ${INGESTION_ENABLED:-true}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      OPEN_METEO_BASE_URL: ${OPEN_METEO_BASE_URL:-https://api.open-meteo.com}
    ports:
      - "${METEOHUB_PORT:-8080}:8080"
    volumes:
      - ./backups:/app/backups
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

volumes:
  postgres-data:
