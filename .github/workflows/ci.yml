name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_DB: meteohub
          POSTGRES_USER: meteohub
          POSTGRES_PASSWORD: ci-password-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U meteohub -d meteohub"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run test:integration
      - run: pnpm run db:migrate
        env:
          DATABASE_URL: postgres://meteohub:ci-password-only@localhost:5432/meteohub
          DATABASE_SSL: "false"
      - run: pnpm run db:verify
      - name: Security and license checks
        shell: bash
        run: |
          set -euo pipefail
          pnpm audit --audit-level=high
          test -f LICENSE
          test -f THIRD_PARTY_NOTICES.md
          ! rg -n --hidden -g '!.git/**' -g '!node_modules/**' -g '!dist/**' '-----BEGIN (RSA|EC|OPENSSH|DSA|PRIVATE) KEY-----|gh[pousr]_[A-Za-z0-9_-]{20,}|github_pat_[A-Za-z0-9_-]{20,}' .
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          platforms: linux/amd64
          tags: meteohub-server:ci
          provenance: mode=max
          sbom: true
