name: Server candidate image

on:
  workflow_dispatch:
    inputs:
      version:
        description: Candidate semver without the v prefix
        required: true
        default: 1.0.0

permissions:
  contents: read
  packages: write

jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate candidate version
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ inputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
      - name: Compute lowercase image name
        id: meta
        shell: bash
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/meteohub-server" >> "$GITHUB_OUTPUT"
      - name: Build and publish candidate image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.image }}:candidate-${{ inputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.licenses=MIT
          provenance: mode=max
          sbom: true
      - name: Generate source SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: meteohub-server-candidate-${{ inputs.version }}.spdx.json

      - name: Export amd64 candidate archive for offline VM validation
        shell: bash
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          docker buildx build \
            --platform linux/amd64 \
            --tag "$IMAGE:candidate-$VERSION" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.version=$VERSION" \
            --label "org.opencontainers.image.licenses=MIT" \
            --provenance=false \
            --sbom=false \
            --load .
          docker save "$IMAGE:candidate-$VERSION" -o "meteohub-server-candidate-$VERSION-amd64.tar"

      - name: Upload candidate evidence
        uses: actions/upload-artifact@v4
        with:
          name: meteohub-server-candidate-${{ inputs.version }}
          path: |
            meteohub-server-candidate-${{ inputs.version }}.spdx.json
            meteohub-server-candidate-${{ inputs.version }}-amd64.tar
      - name: Publish digest summary
        shell: bash
        run: |
          echo "Candidate digest: ${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
