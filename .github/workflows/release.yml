name: Server stable release image

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  packages: write

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_DB: meteohub
          POSTGRES_USER: meteohub
          POSTGRES_PASSWORD: ci-password-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U meteohub -d meteohub"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run test:integration
      - run: pnpm run build
      - run: pnpm run db:migrate
        env:
          DATABASE_URL: postgres://meteohub:ci-password-only@localhost:5432/meteohub
          DATABASE_SSL: "false"
      - run: pnpm audit --audit-level=high
      - name: Verify release metadata
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          grep -q '"version": "1.0.0"' package.json || grep -q "\"version\": \"$version\"" package.json
          test -f LICENSE
          test -f THIRD_PARTY_NOTICES.md
  publish:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute stable tags and OCI labels
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          [[ "$version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "major=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          echo "minor=${BASH_REMATCH[1]}.${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"
          {
            echo 'tags<<EOF'
            echo "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/meteohub-server:$version"
            echo "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/meteohub-server:${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
            echo "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/meteohub-server:${BASH_REMATCH[1]}"
            echo "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/meteohub-server:latest"
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - name: Build and publish stable image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.licenses=MIT
          provenance: mode=max
          sbom: true
      - name: Export amd64 image archive for constrained hosts
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/meteohub-server
        run: |
          set -euo pipefail
          docker buildx build \
            --platform linux/amd64 \
            --tag "${IMAGE,,}:release-${VERSION}-amd64" \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --label "org.opencontainers.image.version=${VERSION}" \
            --label "org.opencontainers.image.licenses=MIT" \
            --load .
          docker save "${IMAGE,,}:release-${VERSION}-amd64" | gzip -c > "meteohub-server-${VERSION}-linux-amd64.tar.gz"
      - name: Generate source SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: meteohub-server-${{ steps.meta.outputs.version }}.spdx.json
      - name: Upload stable release evidence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          sha256sum compose.yml .env.example README.md DEPLOYMENT.md BACKUP_AND_RESTORE.md docs/release-runbook.md docs/ubuntu-vm-deployment.md COMPATIBILITY.md THIRD_PARTY_NOTICES.md "meteohub-server-${{ steps.meta.outputs.version }}-linux-amd64.tar.gz" meteohub-server-${{ steps.meta.outputs.version }}.spdx.json > SHA256SUMS
          gh release upload "$GITHUB_REF_NAME" compose.yml .env.example README.md DEPLOYMENT.md BACKUP_AND_RESTORE.md docs/release-runbook.md docs/ubuntu-vm-deployment.md COMPATIBILITY.md THIRD_PARTY_NOTICES.md "meteohub-server-${{ steps.meta.outputs.version }}-linux-amd64.tar.gz" SHA256SUMS meteohub-server-${{ steps.meta.outputs.version }}.spdx.json --clobber
          echo "Stable image digest: ${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
